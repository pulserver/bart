name: Portability

# The fixed-width types hold dimensions, strides and flag sets at 64 bits on
# every data model: LP64 (Linux, macOS) and LLP64 (64-bit Windows, where long
# is 32 bits).  Each job builds with format and pointer-type mismatches as
# errors and runs the unit tests, test_dimtypes among them.

on:
  push:
  workflow_dispatch:

env:
  OMP_NUM_THREADS: 1

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -yq gcc make libfftw3-dev liblapacke-dev libpng-dev libopenblas-dev gfortran
    - name: make all
      run: make -j4 all
    - name: make utest
      run: make -j4 utest

  macos:
    runs-on: macos-14
    env:
      CC: gcc-mp-14
    steps:
    - uses: melusina-org/setup-macports@v1.1.4
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: install dependencies
      run: |
        port install fftw-3-single gcc14 libpng openblas flock gmake coreutils
        echo PATH=/opt/local/libexec/gnubin/:"$PATH" >> $GITHUB_ENV
    - name: make all
      run: make -j4 all
    - name: make utest
      run: make -j4 utest

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          make
          git
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-fftw
          mingw-w64-x86_64-openblas
          mingw-w64-x86_64-libpng
    - name: data model
      run: |
        printf '#include <stdio.h>\n#include <stdint.h>\nint main(void) { printf("long %%d, long long %%d, void* %%d, int64_t %%d\\n", (int)sizeof(long), (int)sizeof(long long), (int)sizeof(void*), (int)sizeof(int64_t)); return 4 != sizeof(long); }\n' > model.c
        gcc model.c -o model.exe
        ./model.exe
    - name: make all
      run: make -j4 all
    - name: make utest
      run: make -j4 utest
